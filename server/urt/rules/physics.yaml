# URT physics generation rules. Source of truth for the generation agent, sampler and validator.
# Edit, bump rules_version, run `python -m corpus_analysis.synthesis check`, then set status: approved.
schema_version: 1
rules_version: "physics-2026.10.0"
status: approved
subject: physics

generated_from:
  corpus_passages: 14
  analysis_prompt: analyze_passage.v1
  synthesized_at: "2026-10-25"
  sources:
    - Physics Released URT Items 2018.pdf
    - Physics Released URT Test 2019.pdf
    - phy _ chem URT 2020.pdf
    - physics urt 2022.pdf
  provenance: >-
    Official released URT physics papers (2018, 2019, 2020, 2022); the 2021 paper was photos only and is
    not included. Several items appear in more than one paper (the magnetism viewpoints passage, a heating
    curve passage, the instrument-spectra passage); duplicates are counted once in the topic weights. The
    topic list covers only what these papers contain; add syllabus topics (e.g. electricity, circuits,
    modern physics) by hand if the exam covers them.

sampling:
  variety_alpha: 0.6
  recent_topic_window: 5
  recent_topic_penalty: 0.5
  pool_balance_weight: 0.3

topics:
  - id: thermal_physics
    label: Thermal physics
    weight: 3
    subtopics:
      - {id: heating_curves_phase_changes, label: "Heating curves and phase changes", weight: 1.5}
      - {id: heat_transfer_cooling, label: "Heat transfer, cooling rates and thermal equilibrium", weight: 1.5}
    source_labels: [thermal physics, thermodynamics]
  - id: mechanics
    label: Mechanics
    weight: 3
    subtopics:
      - {id: drag_terminal_velocity, label: "Drag, fluid resistance and terminal velocity", weight: 2}
      - {id: friction, label: "Static friction on an inclined plane", weight: 1}
    source_labels: [mechanics]
  - id: waves_sound
    label: Waves and sound
    weight: 2
    subtopics:
      - {id: sound_propagation, label: "Sound propagation, speed and interference", weight: 1}
      - {id: standing_waves_harmonics, label: "Standing waves and harmonics in air columns", weight: 1}
    source_labels: [waves and acoustics]
  - id: optics
    label: Optics
    weight: 2
    subtopics:
      - {id: lenses_image_formation, label: "Thin lenses and image formation", weight: 1}
      - {id: refraction_reflection, label: "Refraction, reflection and Snell's law", weight: 1}
    source_labels: [optics]
  - id: magnetism
    label: Magnetism
    weight: 1
    subtopics:
      - {id: ferromagnetism_models, label: "Ferromagnetism and competing models of magnetic attraction", weight: 1}
    source_labels: [magnetism, magnetism and magnetic fields]

styles:
  - id: experiment_report
    label: Experiment report
    weight: 5
    structure:
      - "Short introduction of the phenomenon and the quantity being investigated"
      - "Setup or model (often a proposed equation with unknown constants or exponents)"
      - "One to three experiments, each changing one variable, each with its own data table"
      - "No conclusion paragraph: the questions draw the conclusions"
    description: >-
      A lab-style account of controlled experiments. Each experiment varies one quantity and records the
      result in a table; later experiments test a different variable. The text explains what was measured
      and how, but leaves interpretation to the questions.
  - id: expository
    label: Expository with data
    weight: 4
    structure:
      - "Definition paragraph introducing the concept and its terms"
      - "Paragraph relating the measurable quantities (often with one formula)"
      - "One or two graphs or a reference table extending the text"
    description: >-
      A textbook-like explanation of a concept (sound, refraction, phase changes, terminal velocity),
      sometimes framed by a real event, followed by graphs or a reference table that the questions use.
      Mixes conceptual questions answerable from the text with graph-reading questions.
  - id: data_report
    label: Data report
    weight: 2
    structure:
      - "Brief context and definitions"
      - "Description of a measurement over time or across conditions"
      - "Figure 1 (and often a comparable Figure 2 for a second substance or instrument)"
    description: >-
      Centred on one or two graphs (heating curves, spectra) with labelled points or regions. Most
      questions are direct readings or comparisons between the two figures.
  - id: two_viewpoints
    label: Comparison of two viewpoints
    weight: 1
    structure:
      - "One-sentence introduction of the phenomenon"
      - "Scientist 1: an older or mechanical explanation"
      - "Scientist 2: the modern explanation"
    description: >-
      Two scientists explain the same phenomenon differently. No figure is needed. Questions ask which
      viewpoint explains or is contradicted by an observation, and where the two agree.

difficulty_levels:
  easy:
    weight: 5
    definition: >-
      The answer to most questions is stated in the text or read directly from one table row or one
      point on a graph. One reasoning step at most; no calculation beyond reading a value.
    passage_markers:
      - "Clear definitions given before they are used"
      - "Standard, clean graphs (e.g. heating curves with obvious plateaus) or small tables with monotonic trends"
      - "One experiment or one figure carries most of the questions"
    question_markers:
      - "Read a value or identify a labelled point or region"
      - "Identify which variable was changed in an experiment"
      - "Rank items directly from a table column"
  medium:
    weight: 9
    definition: >-
      Questions need two or three steps: combining the text with a figure, comparing trends across two
      series or tables, interpolating, or a short proportional calculation. Most URT physics passages
      are at this level.
    passage_markers:
      - "Two or more experiments or figures that must be related to each other"
      - "A formula with unknown exponents or constants to be found from data"
      - "Graphs with two series (e.g. two conditions) or non-trivial axes (unit conversion, reversed axis)"
    question_markers:
      - "Choose the pair of trials that isolates one variable"
      - "Proportional scaling or ratio reasoning to find an unknown value"
      - "Compare slopes or curvature between series"
      - "Interpolate between tabulated values"
  hard:
    weight: 0
    definition: >-
      Not used as an overall passage level: no passage in the corpus was hard. Individual hard questions
      (about 6%) appear inside medium passages: they chain several steps, such as deriving an exponent from
      ratios and then predicting a graph shape, or applying an outside concept to the data.
    passage_markers:
      - "Not used at passage level"
    question_markers:
      - "Multi-step derivation from data followed by a prediction"
      - "Requires a physics principle not stated in the passage, applied to the figure"

allowed_combinations:
  - {style: experiment_report, difficulty: medium, weight: 5}
  - {style: experiment_report, difficulty: easy, weight: 1}
  - {style: expository, difficulty: medium, weight: 3}
  - {style: expository, difficulty: easy, weight: 1}
  - {style: data_report, difficulty: easy, weight: 2}
  - {style: two_viewpoints, difficulty: medium, weight: 1}
  - {style: two_viewpoints, difficulty: easy, weight: 1}

length_words: {min: 200, max: 500, p50: 310}
reading_level_grade: {min: 8.5, max: 11, p50: 9.5}

figures:
  probability: 0.85
  max_per_passage: 3
  kinds:
    - kind: table
      weight: 1
      rows: {min: 3, max: 8}
      columns: {min: 2, max: 6}
      conventions:
        - "Titled 'Table 1', 'Table 2', … and referred to by that name in the text and questions"
        - "One row per trial or condition; first column identifies the trial, material or condition"
        - "Column headers carry the quantity and its unit in parentheses, e.g. 'Velocity (m/s)'"
        - "Values have consistent decimal places; trends are physically plausible and mostly monotonic"
        - "Sometimes one cell is unknown (marked X) for the student to calculate"
    - kind: line_chart
      weight: 1
      series: {min: 1, max: 2}
      points: {min: 5, max: 12}
      conventions:
        - "Titled 'Figure 1', 'Figure 2', …; axes labelled with quantity and unit"
        - "Two series compare two conditions (e.g. dry vs humid air) on the same axes"
        - "Heating-curve style graphs may label points or segments with letters (A–E) that questions refer to"
        - "A pair of figures for two substances or instruments uses identical axes so they can be compared"

question_set:
  count: {min: 4, max: 7, typical: 5}
  options_per_question: 4
  answer_position_balance: true
  types:
    - id: data_interpretation
      label: Data interpretation
      share: 0.41
      uses_figure: true
      skills:
        - "Read a value or locate a labelled point on a graph"
        - "Compare two series or two figures"
        - "Match a relationship in the data to the shape of a graph"
      description: "Answered from a table or graph; the most common type."
    - id: inference
      label: Inference
      share: 0.25
      uses_figure: false
      skills:
        - "Relate physical quantities to observable effects (e.g. amplitude to loudness)"
        - "Predict the outcome of a described situation using the passage's principle"
      description: "Goes one step beyond what is stated, using the passage's principle; sometimes uses the figure."
    - id: detail
      label: Detail
      share: 0.14
      uses_figure: false
      skills:
        - "Identify a condition or fact stated in the text"
        - "Identify which viewpoint explains a phenomenon"
      description: "Answer stated in the text; usually easy."
    - id: calculation
      label: Calculation
      share: 0.08
      uses_figure: true
      skills:
        - "Proportional scaling to find an unknown value"
        - "Interpolate between tabulated values"
        - "Net change across conditions"
      description: "Short arithmetic from table or graph values; no calculus, simple ratios."
    - id: hypothesis_evaluation
      label: Hypothesis or viewpoint evaluation
      share: 0.07
      uses_figure: false
      skills:
        - "Decide which viewpoint an observation contradicts"
        - "Choose the trials that test a stated hypothesis"
      description: "Tests a claim against the data or an observation."
    - id: experimental_design
      label: Experimental design
      share: 0.05
      uses_figure: true
      skills:
        - "Identify the independent variable or the purpose of a change"
        - "Select the minimum set of trials needed to determine an unknown"
      description: "About controlled variables and what each experiment can show."
  stem_conventions:
    - "Short, direct stems; figure questions name the figure ('According to Figure 1', 'Based on Table 2')"
    - "Comparative stems ask how one condition differs from another"
    - "Each passage carries a short title naming its topic (e.g. 'Passage I: <topic>')"

distractor_conventions:
  - "Wrong options reverse a comparison or a trend (greater vs smaller, increases vs decreases)"
  - "Binary outcomes are paired symmetrically across options (e.g. a 2×2 grid of greater/smaller × longer/shorter)"
  - "Data distractors use an adjacent row, column or the wrong series of the figure"
  - "Trial-pair distractors pick pairs in which more than one variable changes"
  - "Calculation distractors come from a common slip: linear instead of quadratic scaling, ignoring one factor"
  - "Graph-shape options show the standard alternatives: linear, inverse, quadratic, decreasing"
  - "Misconception distractors confuse related ideas (pitch vs speed, temperature rise vs phase-change plateau)"

answer_conventions:
  - "Exactly four options, A–D, one correct"
  - "Numeric options in ascending order, with units"
  - "Pair options written as 'x and y', listed in numerical order"
  - "Options are parallel in grammar and length"
  - "Approximate values marked with '≈' or 'approximately'"

anti_patterns:
  - "Never require a figure that cannot be built from data (apparatus sketches, ray diagrams, photos); describe the setup in words instead"
  - "No calculus and no multi-line derivations; arithmetic stays at ratios, scaling and interpolation"
  - "No question answerable without reading the passage or its figure, except a minority (about one in five) testing a basic physics principle"
  - "No 'all of the above' or 'none of the above' options (not seen in the corpus)"
  - "No data that contradicts physics (e.g. a phase-change plateau that is not flat, sound slower in steel than in air)"
  - "No two options that are both defensible; distractors must be clearly wrong on the data"
  - "No conclusion paragraph that gives away the answers"
